name: Textdoc Download to Main to Gofile

on:
  push:
    branches:
      - Mainn
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          pip install jq
          sudo apt-get update
          sudo apt-get install -y aria2 curl jq

      - name: Download links from Textdoc
        run: |
          curl -s https://textdoc.co/5xvG5PnuTb838mhsX | grep -oP 'magnet:\S+|https?://\S+\.(mp4|mkv|avi|srt)' > links.txt

      - name: Download torrent content with aria2c
        run: |
          mkdir -p downloaded_files
          aria2c --seed-time=0 --dir=downloaded_files -i links.txt

      - name: Upload all downloaded files to Gofile
        run: |
          #!/bin/bash
          
          # Set variables
          NUM_FOLDERS=2
          PARENT_FOLDER_ID="5d7be1a0-2cff-4737-baae-aa9b373be510"  # Leave empty if creating folders in root
          DOWNLOADS_DIR="./downloaded_files"
          
          CREATE_FOLDER_URL="https://api.gofile.io/contents/createFolder"
          UPLOAD_FILE_URL="https://upload.gofile.io/uploadFile"
          
          # Add your Gofile API token here
          API_TOKEN="dgBrL8DBLF7n8e1axOZpIXks5aG6dtpu"  # <-- Replace this line with your API token
          
          # Function to create a folder
          create_folder() {
            local folder_name="$1"
            local parent_id="$2"
            local data="{\"folderName\":\"$folder_name\""
            if [ -n "$parent_id" ]; then
              data="$data, \"parentFolderId\": \"$parent_id\""
            fi
            data="$data}"
          
            response=$(curl -s -X POST "$CREATE_FOLDER_URL" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$data")
          
            # Parse folder ID
            echo "$response" | jq -r '
              if .status == "ok" then
                .data.id
              else
                empty
              end
            '
          }
          
          # Gather files
          mapfile -t files < <(find "$DOWNLOADS_DIR" -type f)
          
          total_files=${#files[@]}
          if [ "$total_files" -eq 0 ]; then
            echo "No files found in $DOWNLOADS_DIR."
            exit 1
          fi
          
          # Sort files
          IFS=$'\n' sorted_files=($(sort -V <<<"${files[*]}"))
          unset IFS
          
          # Create folders
          declare -a folder_ids
          for i in $(seq 1 "$NUM_FOLDERS"); do
            folder_name="Folder_$i"
            folder_id=$(create_folder "$folder_name" "$PARENT_FOLDER_ID")
            if [ -n "$folder_id" ]; then
              folder_ids+=("$folder_id")
              echo "Created folder '$folder_name' with ID: $folder_id"
            else
              echo "Failed to create folder '$folder_name'."
            fi
          done
          
          if [ "${#folder_ids[@]}" -eq 0 ]; then
            echo "No folders created. Exiting."
            exit 1
          fi
          
          # Distribute files evenly among folders
          files_per_folder=$(( (total_files + NUM_FOLDERS - 1) / NUM_FOLDERS ))
          
          for idx in "${!sorted_files[@]}"; do
            folder_index=$(( idx / files_per_folder ))
            if [ "$folder_index" -ge "$NUM_FOLDERS" ]; then
              folder_index=$(( NUM_FOLDERS - 1 ))
            fi
            folder_id="${folder_ids[$folder_index]}"
            file_path="${sorted_files[$idx]}"
            filename=$(basename "$file_path")
            echo "Uploading '$filename' to folder ID $folder_id..."
            
            response=$(curl -s -X POST "$UPLOAD_FILE_URL" \
              -H "Authorization: Bearer $API_TOKEN" \
              -F "file=@$file_path" \
              -F "folderId=$folder_id")
            
            status=$(echo "$response" | jq -r '.status')
            if [ "$status" == "ok" ]; then
              echo "Uploaded '$filename' successfully."
            else
              message=$(echo "$response" | jq -r '.message')
              echo "Failed to upload '$filename': $message"
            fi
          done
